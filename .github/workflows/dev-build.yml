name: dev-build

# 手动触发或推送到 main 时构建 APK。未配置签名密钥时使用一次性密钥：
# 每次构建签名不同，开发版之间升级需先在相机上卸载旧版（相机设置不受
# 影响，仅应用内的收藏夹会清空）。正式发布前应配置 ANDROID_KEYSTORE_*
# 密钥组，让每次构建同签名。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (build-tools 30.0.3, platform-28)
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSfL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;30.0.3" "platforms;android-28" >/dev/null
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: NDK r16b (the last GCC toolchain this Android 2.3.7 target builds with)
        run: |
          set -e
          curl -sSfL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
          unzip -q /tmp/ndk.zip -d "$HOME"
          echo "ANDROID_NDK=$HOME/android-ndk-r16b" >> "$GITHUB_ENV"

      - name: Unit tests
        run: bash tools/test.sh

      - name: Build APK
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RecipeLab-apk
          path: RecipeLab.apk
          if-no-files-found: error
